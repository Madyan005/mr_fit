# MR-Fit: heap sized for a 16 GB development machine that also runs the emulator (docs/DECISIONS.md D-057).
# The Flutter template default (-Xmx8G, MaxMetaspaceSize=4G) let Gradle claim most of RAM and the
# Dart kernel compiler then failed with "Could not reserve virtual memory".
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
